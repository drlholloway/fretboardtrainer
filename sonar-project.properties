# What SonarQube Cloud analyzes (.github/workflows/test.yml, the SonarQube
# job). The organization and project key come from the workflow.
#
# SonarQube Cloud analyzes the whole repository. It ignores sonar.sources,
# sonar.tests and sonar.test.inclusions, so the scope is set only by what's
# left out, here and under coverage.

# Flutter's generated Linux runner; none of it is Fretman's own code.
sonar.exclusions=apps/fretboard_trainer/linux/**

# Written by the tests in the SonarQube job.
sonar.dart.lcov.reportPaths=packages/fretboard_theory/coverage/lcov.info,apps/fretboard_trainer/coverage/lcov.info

# Left out of the coverage figure, so it describes Fretman's own Dart code:
# the tests themselves, with the screenshot harness built on them; the
# native Android, iOS and macOS runners; and the packaging, icon, splash
# and audio scripts.
sonar.coverage.exclusions=**/test/**,apps/fretboard_trainer/android/**,apps/fretboard_trainer/ios/**,apps/fretboard_trainer/macos/**,packaging/**
